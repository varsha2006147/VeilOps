# VeilOps collector config (Member A owns sources/windows; Member B owns transport/policy keys)
collector_id: ${COLLECTOR_ID:-col_blr_01}
tenant_id: ${TENANT_ID:-t_acme}
region: ${REGION:-in}
environment: ${ENVIRONMENT:-blr-dc1}
source_tz: ${SOURCE_TZ:-Asia/Kolkata}
ingest_url: ${INGEST_URL:-https://in.ingest.veilops.local/v1}
db_path: ${DB_PATH:-data/collector_acme.db}
demo_mode: ${DEMO_MODE_CFG:-true}
downstream: ${DOWNSTREAM:-privacy}   # privacy -> outbox -> cloud; set VEILOPS_ENROLLMENT_TOKEN once to enroll
topology_file: ${TOPOLOGY_FILE:-veilops/collector/topology.example.yaml}

sources:
  stream:                   # ORGANIZER STREAM - switch driver/url at the event
    enabled: ${STREAM_ENABLED:-false}
    driver: ${STREAM_DRIVER:-sse}        # file | csv | sse | websocket | http_poll | kafka
    url: ${STREAM_URL:-http://localhost:9000/stream}
    path: ${STREAM_PATH:-data/stream.jsonl}
    map_file: veilops/collector/stream_map.yaml
    tenant_filter: ${TENANT_ID:-t_acme}
  extra_streams:            # more feeds; the remediation sandbox exposes its live metrics here
    - name: sandbox
      enabled: ${SANDBOX_ENABLED:-false}
      driver: http_poll
      url: ${SANDBOX_URL:-http://localhost:9100}/metrics
      interval_s: 1
  sim:                      # SIMULATED (team) - rehearsal + Chaos tab
    enabled: ${SIM_ENABLED:-true}
    interval_s: 1
  host:
    enabled: true
    interval_s: 1
  probes:
    enabled: true
    interval_s: 2
    count: 3
    targets:
      - { name: gw-dns, host: 1.1.1.1, port: 53 }
      - { name: api-gw, host: 8.8.8.8, port: 53 }
  syslog:
    enabled: true
    udp_port: ${SYSLOG_PORT:-5514}
    files: [/var/log/auth.log]

windows:
  metrics_s: 5
  allowed_lateness_s: 300
retention:
  raw_h: 72
ui:
  host: 0.0.0.0
  port: 8100
